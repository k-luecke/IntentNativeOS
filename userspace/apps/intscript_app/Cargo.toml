[package]
name = "intscript_app"
version = "0.1.0"
edition = "2021"

[lib]
name = "intscript_app"
path = "src/lib.rs"

[[bin]]
name = "intscript_app"
path = "src/main.rs"

[dependencies]
inos-app-sdk = { path = "../../sdk" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
