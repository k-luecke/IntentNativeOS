[package]
name = "web_render"
version = "0.1.0"
edition = "2021"
authors = ["INOS Application Foundry"]

[lib]
name = "web_render"
path = "src/lib.rs"

[[bin]]
name = "web_render"
path = "src/main.rs"
test = false
doctest = false

[dependencies]
inos-app-sdk = { path = "../../sdk" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = false
